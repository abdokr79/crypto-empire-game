<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Empire - التصميم الجديد</title>
    <!-- مكتبة Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <!-- سكربت تيليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0F19; color: white; overflow: hidden; }
        .font-num { font-family: 'Orbitron', sans-serif; }
        /* تأثير الزجاج */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        /* تأثير النيون */
        .neon-glow { box-shadow: 0 0 15px rgba(34, 211, 238, 0.5); }
        .neon-text { text-shadow: 0 0 10px rgba(34, 211, 238, 0.7); }
    </style>
</head>
<body class="h-screen flex flex-col relative">

    <!-- 1. الشريط العلوي (Header) -->
    <header class="flex justify-between items-center p-4 glass-panel rounded-b-3xl z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-r from-cyan-400 to-blue-600 p-[2px]">
                <div class="w-full h-full bg-[#0B0F19] rounded-full flex items-center justify-center font-bold text-sm">👤</div>
            </div>
            <div>
                <p class="text-xs text-gray-400">المستوى</p>
                <p class="text-sm font-bold text-cyan-400 font-num">12</p>
            </div>
        </div>
        
        <div class="glass-panel px-4 py-1 rounded-full flex items-center gap-2 border-cyan-500/30">
            <span class="text-yellow-400 text-lg">💰</span>
            <span class="font-num font-bold text-xl neon-text">1,250</span>
        </div>
    </header>

    <!-- 2. منطقة اللعب (Main Game Area) -->
    <main class="flex-1 flex items-center justify-center p-4 relative">
        <!-- مؤثرات خلفية -->
        <div class="absolute top-1/4 left-1/4 w-32 h-32 bg-purple-600 rounded-full blur-[100px] opacity-30"></div>
        <div class="absolute bottom-1/4 right-1/4 w-32 h-32 bg-cyan-600 rounded-full blur-[100px] opacity-30"></div>

        <!-- الكارت الزجاجي للعبة -->
        <div class="glass-panel w-full max-w-sm aspect-square rounded-3xl flex flex-col items-center justify-center relative neon-glow">
            <!-- هنا توضع اللعبة (Canvas / SVG / Divs) -->
            <div class="text-center">
                <div class="text-6xl mb-4 animate-bounce">🚀</div>
                <h2 class="text-2xl font-bold mb-2">إمبراطورية الكريبتو</h2>
                <p class="text-sm text-gray-400 px-6">اضغط للبدء بجمع الأرباح وتطوير إمبراطوريتك</p>
            </div>
            
            <!-- زر التفاعل الرئيسي -->
            <button id="tapBtn" class="mt-6 bg-cyan-500/20 border border-cyan-400 text-cyan-300 px-8 py-3 rounded-xl font-bold hover:bg-cyan-500/30 transition-all active:scale-95">
                اضغط هنا
            </button>
        </div>
    </main>

    <!-- 3. شريط التنقل السفلي (Bottom Nav) -->
    <nav class="glass-panel rounded-t-3xl p-2 flex justify-around items-center z-10 pb-6">
        <button class="flex flex-col items-center p-2 text-cyan-400">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] font-bold">الرئيسية</span>
        </button>
        
        <button class="flex flex-col items-center p-2 text-gray-500 hover:text-gray-300 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            <span class="text-[10px] font-bold">المتجر</span>
        </button>
        
        <button class="flex flex-col items-center p-2 text-gray-500 hover:text-gray-300 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <span class="text-[10px] font-bold">الترقيات</span>
        </button>
        
        <button class="flex flex-col items-center p-2 text-gray-500 hover:text-gray-300 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] font-bold">حسابي</span>
        </button>
    </nav>

    <script>
        // تفعيل وضع تيليجرام (يجعل الخلفية متوافقة مع ثيم التطبيق)
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#0B0F19');
        tg.setBackgroundColor('#0B0F19');

        // تأثير الاهتزاز عند الضغط على الزر (Haptic Feedback)
        document.getElementById('tapBtn').addEventListener('click', () => {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });
    </script>
</body>
</html>
