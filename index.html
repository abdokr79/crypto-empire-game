<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyberpunk Subway Runner - Crypto Empire</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #fff; user-select: none; overflow: hidden; margin: 0; }
        canvas { display: block; margin: 0 auto; background: linear-gradient(to bottom, #0f172a, #1e1b4b); box-shadow: 0 0 30px rgba(6, 182, 212, 0.4); }
    </style>
</head>
<body class="flex flex-col h-screen justify-between max-w-md mx-auto relative border-x border-slate-800">

    <!-- Top Hud -->
    <header class="flex justify-between items-center p-3 bg-slate-900/90 backdrop-blur border-b border-cyan-500/30 z-10">
        <div>
            <p class="text-[10px] text-cyan-400 font-bold">الرصيد المكتسب</p>
            <h1 class="text-lg font-black text-cyan-300" id="score">0 USDT</h1>
        </div>
        <div class="text-left">
            <span class="text-xs bg-purple-500/20 text-purple-300 px-2.5 py-1 rounded-full border border-purple-500/40 font-bold" id="level-hud">Cyber Runner v1.0</span>
        </div>
    </header>

    <!-- Game Canvas View -->
    <main class="flex-1 flex flex-col items-center justify-center relative p-0 overflow-hidden">
        <canvas id="gameCanvas" width="360" height="480"></canvas>
        
        <!-- Controls Overlay for Mobile -->
        <div class="absolute bottom-4 left-0 right-0 flex justify-around px-6 z-20">
            <button onclick="movePlayer(-1)" class="w-20 h-20 bg-cyan-600/40 border-2 border-cyan-400 rounded-2xl active:bg-cyan-500 text-2xl font-black shadow-lg backdrop-blur flex items-center justify-center">◀</button>
            <button onclick="jumpPlayer()" class="w-24 h-20 bg-pink-600/40 border-2 border-pink-400 rounded-2xl active:bg-pink-500 text-sm font-black shadow-lg backdrop-blur flex items-center justify-center">🚀 قفز</button>
            <button onclick="movePlayer(1)" class="w-20 h-20 bg-cyan-600/40 border-2 border-cyan-400 rounded-2xl active:bg-cyan-500 text-2xl font-black shadow-lg backdrop-blur flex items-center justify-center">▶</button>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="grid grid-cols-2 bg-slate-900 border-t border-slate-800 py-2 text-center text-xs z-10">
        <button onclick="switchTab('game')" id="nav-game" class="text-cyan-400 font-bold flex flex-col items-center">
            <span class="text-lg mb-0.5">⚡</span> السابواي
        </button>
        <button onclick="switchTab('shop')" id="nav-shop" class="text-slate-400 flex flex-col items-center">
            <span class="text-lg mb-0.5">🛒</span> المتجر والترقيات
        </button>
    </nav>

    <!-- Shop View (Hidden) -->
    <div id="shop-view" class="absolute inset-x-0 top-14 bottom-12 bg-slate-950/95 p-4 hidden z-30 overflow-y-auto">
        <h2 class="text-lg font-black text-pink-400 mb-3">🛒 متجر العتاد السيبراني</h2>
        <div class="space-y-3">
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-sm text-cyan-300">درع الحماية السيبراني</h3>
                    <p class="text-xs text-slate-400">يمنحك حياة إضافية عند الاصطدام</p>
                    <p class="text-xs text-emerald-400 mt-1">السعر: 50 USDT</p>
                </div>
                <button onclick="buyItem('shield')" class="bg-cyan-600 px-3 py-2 rounded-lg text-xs font-bold">شراء</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const tg = window.Telegram.WebApp;
        if (tg && tg.expand) tg.expand();

        let score = 0;
        let gameActive = true;

        // Player properties (3 lanes: x = 90, 180, 270)
        let lanes = [90, 180, 270];
        let currentLane = 1;
        let player = {
            x: lanes[1],
            y: 380,
            width: 35,
            height: 50,
            vy: 0,
            isJumping: false
        };

        let obstacles = [];
        let coins = [];
        let gameSpeed = 4;

        function movePlayer(dir) {
            currentLane += dir;
            if (currentLane < 0) currentLane = 0;
            if (currentLane > 2) currentLane = 2;
            player.x = lanes[currentLane];
        }

        function jumpPlayer() {
            if (!player.isJumping) {
                player.vy = -10;
                player.isJumping = true;
            }
        }

        // Spawn obstacles & cyber coins
        function spawnEntities() {
            if (Math.random() < 0.03) {
                let lane = Math.floor(Math.random() * 3);
                obstacles.push({ x: lanes[lane], y: -50, width: 40, height: 40, color: '#f43f5e' });
            }
            if (Math.random() < 0.04) {
                let lane = Math.floor(Math.random() * 3);
                coins.push({ x: lanes[lane], y: -50, radius: 12, color: '#34d399' });
            }
        }

        function update() {
            if (!gameActive) return;

            // Player jump physics
            player.y += player.vy;
            if (player.isJumping) {
                player.vy += 0.6;
                if (player.y >= 380) {
                    player.y = 380;
                    player.isJumping = false;
                    player.vy = 0;
                }
            }

            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += gameSpeed;
                // Collision check
                if (Math.abs(obstacles[i].x - player.x) < 25 && Math.abs(obstacles[i].y - player.y) < 35) {
                    gameActive = false;
                    alert("انتهت اللعبة! اصطدمت بحاجز سيبراني. مجموع أرباحك: " + score + " USDT");
                    location.reload();
                }
                if (obstacles[i].y > 500) obstacles.splice(i, 1);
            }

            // Move coins
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].y += gameSpeed;
                if (Math.abs(coins[i].x - player.x) < 25 && Math.abs(coins[i].y - player.y) < 35) {
                    score += 10;
                    document.getElementById('score').innerText = score + " USDT";
                    coins.splice(i, 1);
                }
                if (coins[i].y > 500) coins.splice(i, 1);
            }

            spawnEntities();
            gameSpeed += 0.001; // Increase difficulty over time
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Cyber Lanes grid lines
            ctx.strokeStyle = '#06b6d433';
            ctx.lineWidth = 2;
            lanes.forEach(l => {
                ctx.beginPath();
                ctx.moveTo(l, 0);
                ctx.lineTo(l, 480);
                ctx.stroke();
            });

            // Draw Cyber Player (Neon Runner)
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#06b6d4';
            ctx.fillStyle = '#22d3ee';
            ctx.fillRect(player.x - player.width / 2, player.y, player.width, player.height);

            // Draw Obstacles
            ctx.shadowColor = '#f43f5e';
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x - obs.width / 2, obs.y, obs.width, obs.height);
            });

            // Draw Coins
            ctx.shadowColor = '#34d399';
            coins.forEach(c => {
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0; // Reset
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function switchTab(tab) {
            if (tab === 'shop') {
                document.getElementById('shop-view').classList.remove('hidden');
                document.getElementById('nav-shop').className = "text-pink-400 font-bold flex flex-col items-center";
                document.getElementById('nav-game').className = "text-slate-400 flex flex-col items-center";
                gameActive = false;
            } else {
                document.getElementById('shop-view').classList.add('hidden');
                document.getElementById('nav-game').className = "text-cyan-400 font-bold flex flex-col items-center";
                document.getElementById('nav-shop').className = "text-slate-400 flex flex-col items-center";
                gameActive = true;
            }
        }

        function buyItem(item) {
            if (score >= 50) {
                score -= 50;
                alert("تم تفعيل الدرع بنجاح!");
            } else {
                alert("رصيدك غير كافي!");
            }
        }

        loop();
    </script>
</body>
</html>
